
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Non-Metal Elements</title>

    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container-fluid mt-3">
        <div class="container p-5 mt-3 bg-light text-dark rounded">

            <h1>Non-Metal Elements</h1>
            <p>Enter the symbol of a non-metal element to find its information.</p>

            <form>
                <input type="text" id="element_input" class="form-control mb-3" placeholder="Enter element symbol (e.g. H, O, Cl)">

                <button type="button" class="btn btn-primary" py-click="search_element">
                    Check Details
                </button>
            </form>

            <div id="result" class="mt-4"></div>

        </div>
    </div>

    <py-script src="main.py"></py-script>
</body>
</html>
